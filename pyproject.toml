[project]
name = "observe"
version = "0.1.0"
description = "Prototype: watch an A->B route for traffic jams and find social posts about them"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-auth>=2.30",
    "requests>=2.31",  # transport for google-auth token refresh
    # Pinned to the exact commit that was reviewed before handing it Facebook cookies.
    # Do not bump without re-reviewing: this code holds a logged-in session.
    "facebook-gql-scraper @ git+https://github.com/XD-MHLOO/facebook-gql-scraper@c475eb4b75d18ea099aa63521f673d94a06195c5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
observe = "observe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["observe", "observe.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
